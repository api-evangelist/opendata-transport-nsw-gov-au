            kml:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
            shp:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      summary: Execute various queries on the Traffic Volume Counts API
      tags:
      - /traffic_volume
      operationId: getTrafficVolume
