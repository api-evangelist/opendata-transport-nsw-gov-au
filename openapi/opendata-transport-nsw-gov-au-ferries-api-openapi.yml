info:
  title: Opendata Transport Nsw Gov Au Ferries API
  version: '1.0'
  description: 'Operations tagged ferries across 6 of this provider''s published API definitions: getschedule-busextension_2.6.json, v2-gtfs-alerts-swaggerprod_1.yaml, opendata-transport-nsw-gov-au-gtfs-realtime-alerts-v2-openapi.yml, opendata-transport-nsw-gov-au-gtfs-realtime-trip-updates-v1-openapi.yml, opendata-transport-nsw-gov-au-gtfs-realtime-vehicle-positions-v1-openapi.yml, opendata-transport-nsw-gov-au-gtfs-schedule-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
