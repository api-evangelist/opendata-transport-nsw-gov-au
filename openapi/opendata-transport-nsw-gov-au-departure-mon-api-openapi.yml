openapi: 3.2.0
info:
  title: Opendata Transport Nsw Gov Au Departure Mon API
  version: 10.6.21.17
  description: 'Operations tagged Departure Mon across 2 of this provider''s published API definitions: tripplanner_v1_swag_efa11_20251002.yml, opendata-transport-nsw-gov-au-trip-planner-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.transport.nsw.gov.au/v1/tp
security:
- APIKey: []
tags:
- name: Departure Mon
paths:
  /departure_mon:
    get:
      description: 'This endpoint returns a list of departures for a given location based on the date and time specified. This data can be used to

        display a "upcoming departures" board for a stop.'
      operationId: tfnsw_dm_request
      parameters:
      - description: 'Used to set the response data type. This documentation only covers responses that use the JSON format.

          Setting the `outputFormat` value to `rapidJSON` is required to enable JSON output.

          '
        in: query
        name: outputFormat
        required: true
        schema:
          type: string
          enum:
          - rapidJSON
      - description: This specifies the format the coordinates are returned in. While other variations are available, the `EPSG:4326` format will return the widely-used format.
        in: query
        name: coordOutputFormat
        required: true
        schema:
          type: string
          enum:
          - EPSG:4326
      - description: 'This allows the departure board to display directly without going through the stop verification process. Use this when the stop is known.

          This relies on the given combination of `type_dm` and `name_dm` returning only a single result, otherwise a list of stops and no departures

          shall be returned.

          '
        in: query
        name: mode
        required: false
        schema:
          type: string
          enum:
          - direct
          default: direct
      - description: 'This specifies the type of results expected based on the search input in `name_dm`. By specifying `any`, locations of all types can be returned.

          Typically, this API call is used for a specific stop, so `stop` should be used along with a stop ID or global stop ID in `name_dm`.

          '
        in: query
        name: type_dm
        required: true
        schema:
          type: string
          enum:
          - any
          - coord
          - poi
          - singlehouse
          - stop
          - platform
          - street
          - locality
          - suburb
          default: stop
      - description: 'This is the search term that will be used to find locations. If the combination of this value and `type_dm` results in more than one

          location found - or `mode` is not set to `direct`, then a list of stops and no departures will be returned.

          If `type_dm` is set to `stop` then this value can take a stop ID or a global stop ID.

          '
        in: query
        name: name_dm
        required: true
        schema:
          type: string
          default: 10111010
      - description: 'Setting this parameter to `$USEPOINT$` enables you to request departures for a specific platform within a station. If this isn''t used,

          then departures for all platforms at the stop specified in `name_dm` are returned.

          '
        in: query
        name: nameKey_dm
        required: false
        schema:
          type: string
          enum:
          - $USEPOINT$
      - description: 'The reference date used when searching trips, in `YYYYMMDD` format. For instance, 20160901 refers to

          1 September 2016. Works in conjunction with the `itdTime` value. If not specified, the current server date is used.

          '
        in: query
        name: itdDate
        required: false
        schema:
          type: string
          default: 20161001
      - description: 'The reference time used when searching trips, in `HHMM` 24-hour format. For instance, 2215 refers to 10:15 PM. |

          Works in conjunction with the `itdDate` value. If not specified, the current server time is used.

          '
        in: query
        name: itdTime
        required: false
        schema:
          type: string
          default: 1200
      - allowEmptyValue: true
        description: 'Including this parameter enables a number of options that result in the departure monitor operating in the same way

          as the Transport for NSW Trip Planner web site. It is recommended this is enabled, along with the

          `TfNSWDM` parameter.

          '
        in: query
        name: departureMonitorMacro
        required: false
        schema:
          type: string
          enum:
          - 'true'
          default: 'true'
      - description: 'This parameter which means of transport to exclude from the departure monitor. To exclude one means, select one of the following: `1` = train, `2` = metro, `4` = light rail, `5` = bus, `7` = coach, `9` = ferry, `11` = school bus. `checkbox` allows you to exclude more than one means of transport when used in conjunction with the `exclMOT_<ID>` parameters.

          '
        in: query
        name: excludedMeans
        required: false
        schema:
          type: string
          enum:
          - checkbox
          - '1'
          - '2'
          - '4'
          - '5'
          - '7'
          - '9'
          - '11'
      - description: 'Excludes train services from the departure monitor.  Must be used in conjunction with `excludedMeans=checkbox`

          '
        in: query
        name: exclMOT_1
        required: false
        schema:
          type: string
          enum:
          - '1'
      - description: 'Excludes metro services from the departure monitor.  Must be used in conjunction with `excludedMeans=checkbox`

          '
        in: query
        name: exclMOT_2
        required: false
        schema:
          type: string
          enum:
          - '1'
      - description: 'Excludes light rail services from the departure monitor.  Must be used in conjunction with `excludedMeans=checkbox`

          '
        in: query
        name: exclMOT_4
        required: false
        schema:
          type: string
          enum:
          - '1'
      - description: 'Excludes bus services from the departure monitor.  Must be used in conjunction with `excludedMeans=checkbox`

          '
        in: query
        name: exclMOT_5
        required: false
        schema:
          type: string
          enum:
          - '1'
      - description: 'Excludes coach services from the departure monitor.  Must be used in conjunction with `excludedMeans=checkbox`

          '
        in: query
        name: exclMOT_7
        required: false
        schema:
          type: string
          enum:
          - '1'
      - description: 'Excludes ferry services from the departure monitor.  Must be used in conjunction with `excludedMeans=checkbox`

          '
        in: query
        name: exclMOT_9
        required: false
        schema:
          type: string
          enum:
          - '1'
      - description: 'Excludes school bus services from the departure monitor.  Must be used in conjunction with `excludedMeans=checkbox`

          '
        in: query
        name: exclMOT_11
        required: false
        schema:
          type: string
          enum:
          - '1'
      - allowEmptyValue: true
        description: 'Including this parameter enables a number of options that result in the departure monitor operating in the same way as the

          Transport for NSW Trip Planner web site, including enabling real-time data. It is recommended this is enabled,

          along with the `departureMonitorMacro` parameter.

          '
        in: query
        name: TfNSWDM
        required: false
        schema:
          type: string
          enum:
          - 'true'
          default: 'true'
      - allowEmptyValue: true
        description: 'Indicates which version of the API the caller is expecting for both request and response data. Note that if this version differs

          from the version listed above then the returned data may not be as expected.

          '
        in: query
        name: version
        required: false
        schema:
          type: string
          default: 10.2.1.42
      responses:
        200:
          description: A list of departures for the specified inputs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartureMonitorResponse'
        401:
          description: The application calling the API has not been authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
        500:
          description: An internal error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
        503:
          description: The server is currently unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
      summary: Provides capability to provide NSW public transport departure information from…
      tags:
      - Departure Mon
    servers:
    - url: https://api.transport.nsw.gov.au/v1/tp
components:
  schemas:
    TripRequestResponseJourneyLegStopInfo:
      description: 'This element describes a single information message that may be associated with a journey leg.

        The data in this is similar to that from `add_info`, but is presented differently.

        '
      properties:
        content:
          description: 'This is the descriptive alert content. It may contain HTML tags and/or HTML entities.

            '
          type: string
        id:
          description: 'This is a unique identifier for this particular service alert. Note that this same ID is used in

            `add_info` for the same alert.

            '
          type: string
        priority:
          description: 'This value indicates how important the service alert is. A value of `high` or `veryHigh` likely indicates that

            the alert will correspond to an event that impacts the ability to travel for relevant users, while `low` or `veryLow`

            might be more of an informational message.

            '
          enum:
          - veryLow
          - low
          - normal
          - high
          - veryHigh
          type: string
        subtitle:
          description: 'This is short summary that can be used as a heading for the alert content. It may contain HTML tags and/or HTML entities.

            '
          type: string
        timestamps:
          $ref: '#/components/schemas/AdditionalInfoResponseTimestamps'
          description: 'This contains a number of timestamps that describe when the alert was created, and when the described alert actually

            takes place and/or is relevant.

            '
        url:
          description: 'This field contains a URL that contains additional information about the alert. This value is equivalent to

            the `infoLinkURL` value in `add_info`.

            '
          type: string
        urlText:
          description: 'This field contains a title that can be used when displaying the `url` URL. This value is equivalent to

            the `infoLinkText` value in `add_info`.

            '
          type: string
        version:
          description: 'This number indicates the version of this alert. Initially when it is created it has version `1`, but if it is then

            updated it will have a new `lastModification` value and the version will now be `2`.

            '
          type: integer
      type: object
    HttpErrorResponse:
      description: 'This element contains information about a HTTP error that occurred.

        '
      properties:
        ErrorDateTime:
          description: The date and time that the error occurred.
          type: string
        Message:
          description: A detailed message about the error.
          type: string
        RequestedMethod:
          description: The HTTP request method used for the current request.
          type: string
        RequestedUrl:
          description: The URL for the current request.
          type: string
        TransactionId:
          description: A unique identifier for the current request.
          type: string
      type: object
    TripTransportation:
      description: 'This element describes a route, including information about its route number, usual destination,

        route type and operator.

        '
      properties:
        description:
          description: 'Contains a description of this route.

            '
          type: string
        destination:
          description: 'This element contains information about where vehicles on this route terminate.

            '
          properties:
            id:
              description: 'Contains a unique identifier (if available) of the destination for this route.

                '
              type: string
            name:
              description: 'This is the name of the destination for this route.

                '
              type: string
          type: object
        disassembledName:
          description: 'Contains a very short name for the route.

            '
          type: string
        iconId:
          description: 'Contains an ID for the icon that can be used for this route. Different values here are

            used to differentiate differents types of the same route type. For example, private ferries

            have a different wayfinding icon to ferries operated by Sydney Ferries.


            * `1`: Sydney Trains (product class `1`)

            * `2`: Intercity Trains (product class `1`)

            * `3`: Regional Trains (product class `1`)

            * `19`: Temporary Trains (product class `1`)


            * `24`: Sydney Metro (product class `2`)


            * `13`: Sydney Light Rail (product class `4`)

            * `20`: Temporary Light Rail (product class `4`)

            * `21`: Newcastle Light Rail (product class `4`)


            * `4`: Blue Mountains Buses (product class `5`)

            * `5`: Sydney Buses (product class `5`)

            * `6`: Central Coast Buses (product class `5`)

            * `14`: Temporary Buses (product class `5`)

            * `15`: Hunter Buses (product class `5`)

            * `23`: On Demand (product class `5`)

            * `31`: Central West and Orana (product class `5`)

            * `32`: Far West (product class `5`)

            * `33`: New England North West (product class `5`)

            * `34`: Newcastle and Hunter (product class `5`)

            * `35`: North Coast (product class `5`)

            * `36`: Riverina Murray (product class `5`)

            * `37`: South East and Tablelands (product class `5`)

            * `38`: Sydney and Surrounds (product class `5`)


            * `9`: Private Buses (product class `5`)

            * `17`: Private Coaches (product class `5`)


            * `7`: Regional Coaches (product class `7`)

            * `22`: Temporary Coaches (product class `7`)


            * `10`: Sydney Ferries (product class `9`)

            * `11`: Newcastle Ferries (product class `9`)

            * `12`: Private Ferries (product class `9`)

            * `18`: Temporary Ferries (product class `9`)


            * `8`: School Buses (product class `11`)

            '
          type: integer
        id:
          description: 'This is an ID that uniquely identifies this route.

            '
          type: string
        name:
          description: 'This contains the full name of the route.

            '
          type: string
        number:
          description: 'Contains a short name for the route.

            '
          type: string
        operator:
          description: 'This element describes the operator of this route.

            '
          properties:
            id:
              description: 'Contains a unique identifier for the given operator.

                '
              type: string
            name:
              description: 'Contains the name of the operator of the route.

                '
              type: string
          type: object
        product:
          $ref: '#/components/schemas/RouteProduct'
          description: This element contains additional properties about the route.
        properties:
          description: 'Contains additional properties about this route.

            '
          properties:
            isTTB:
              description: XXX
              type: boolean
            tripCode:
              description: This is an ID for this journey option.
              type: integer
          type: object
      type: object
    StopFinderAssignedStop:
      description: 'An assigned stop is a location that public transport stops at. Locations / places of interest that aren''t stops may have one

        or more stops "assigned" to it as being "the stop(s) you would use if you were in this location".

        '
      properties:
        connectingMode:
          description: 'This is the mode of transport that is used to connect to this stop. The following values are available:


            * `1`: Train

            * `2`: Metro

            * `4`: Light Rail

            * `5`: Bus

            * `7`: Coach

            * `9`: Ferry

            * `11`: School Bus

            * `97`: Remain On-Board

            * `99`: Walking

            * `100`: Walking (Footpath)

            * `101`: Bicycle

            * `102`: Take Bicycle On Public Transport

            * `103`: Kiss & Ride

            * `104`: Park & Ride

            * `105`: Taxi

            * `106`: Car

            '
          type: integer
        coord:
          description: 'Contains exactly two values: the first value is the latitude, the second value is the longitude.

            '
          items:
            format: double
            type: number
          type: array
        disassembledName:
          description: 'This is the short version of the location name, which does not include the suburb or other information.

            '
          type: string
        distance:
          description: This is the distance in metres to this stop from the location to which it is assigned.
          type: integer
        duration:
          description: This is the number of minutes it would take to reach this stop from the location to which it is assigned.
          type: integer
        id:
          description: 'This is a unique ID for the returned location. Certain types of ID can be used for subsequent searches performed with `stop_finder`,

            or can be used as the origin or destination in an `trip` request. The format of a location ID differs greatly, depending

            on the type of location it is.

            '
          type: string
        modes:
          description: 'This is included only if the `type` value is set to `stop`. Contains a list of modes of transport

            that service this stop. This can be useful for showing relevant wayfinding icons when presenting users

            with a list of matching stops to choose from.


            The following values may be present:


            * `1`: Train

            * `2`: Metro

            * `4`: Light Rail

            * `5`: Bus

            * `7`: Coach

            * `9`: Ferry

            * `11`: School Bus

            '
          items:
            type: integer
          type: array
        name:
          description: 'This is the long version of the location name, which may include the suburb or other information.

            '
          type: string
        parent:
          $ref: '#/components/schemas/ParentLocation'
          description: 'If available, contains information about this location''s parent location. For example, if the

            stop has a type of `platform`, then this field may contain information about the station in which

            the platform is located.

            '
        type:
          description: 'A value of `unknown` likely indicates bad data. If a location is returned with this type, you can safely ignore it.

            '
          enum:
          - poi
          - singlehouse
          - stop
          - platform
          - street
          - locality
          - suburb
          - unknown
          type: string
      type: object
    DepartureMonitorResponse:
      description: 'This is the response data returned when performing an `departure_mon` request.

        '
      properties:
        error:
          $ref: '#/components/schemas/ApiErrorResponse'
          description: 'If an error has occurred, this element contains information about the error.

            '
        locations:
          description: 'Contains a list of stops that were matched based on the supplied `type_dm` and `name_dm` request values. There must be exactly

            one location present for the `stopEvents` response data to be populated. Additionally, the `mode` request value must be set

            to `direct`.

            '
          items:
            $ref: '#/components/schemas/StopFinderLocation'
          type: array
        stopEvents:
          description: 'Contains a list of departures/arrivals for the stop included in the `location` property of the response.

            '
          items:
            $ref: '#/components/schemas/DepartureMonitorResponseStopEvent'
          type: array
        version:
          description: 'The version of the API that provided the response. Note that if this value is different to above, then the returned data may be

            different than expected. You can set the expected version using the `version` request parameter.

            '
          type: string
      type: object
    StopFinderLocation:
      description: This element describes a single location that is returned in an `stop_finder` request.
      properties:
        assignedStops:
          description: 'This is a list of stops that are assigned to this location. This means if you''re in the current location and want to catch

            public transport, these assigned stops are directly available to you.

            '
          items:
            $ref: '#/components/schemas/StopFinderAssignedStop'
          type: array
        buildingNumber:
          description: 'This is the number of the property, included only if the `type` value is set to `singlehouse`. Note that it is a string, as it may include non-numeric characters.

            '
          type: string
        coord:
          description: 'Contains exactly two values: the first value is the latitude, the second value is the longitude.

            '
          items:
            format: double
            type: number
          type: array
        disassembledName:
          description: 'This is the short version of the location name, which does not include the suburb or other information.

            '
          type: string
        id:
          description: 'This is a unique ID for the returned location. Certain types of ID can be used for subsequent searches performed with `stop_finder`,

            or can be used as the origin or destination in an `trip` request. The format of a location ID differs greatly, depending

            on the type of location it is.

            '
          type: string
        isBest:
          description: Indicates whether or not this is the best match out of all the returned locations.
          type: boolean
        isGlobalId:
          description: 'This determines whether the id property is a global stop id or not

            '
          type: boolean
        matchQuality:
          description: This value indicates how well the returned stop matches the search query. A higher number indicates a better match.
          type: integer
        modes:
          description: 'This is included only if the `type` value is set to `stop`. Contains a list of modes of transport

            that service this stop. This can be useful for showing relevant wayfinding icons when presenting users

            with a list of matching stops to choose from.


            The following values may be present:


            * `1`: Train

            * `2`: Metro

            * `4`: Light Rail

            * `5`: Bus

            * `7`: Coach

            * `9`: Ferry

            * `11`: School Bus

            '
          items:
            type: integer
          type: array
        name:
          description: 'This is the long version of the location name, which may include the suburb or other information.

            '
          type: string
        parent:
          $ref: '#/components/schemas/ParentLocation'
          description: 'If available, contains information about this location''s parent location. For example, if the

            stop has a type of `platform`, then this field may contain information about the station in which

            the platform is located.

            '
        streetName:
          description: This is included only if the `type` value is set to `street` or `singlehouse`.
          type: string
        type:
          description: 'This is the type of location being returned. It may represent a stop or platform that a public transport service physically

            stops at for passenger boarding, or it may represent somebody''s house.

            A value of `unknown` likely indicates bad data coming from the server. If a location is returned with this type, you can safely ignore it.

            '
          enum:
          - poi
          - singlehouse
          - stop
          - platform
          - street
          - locality
          - suburb
          - address
          - unknown
          type: string
      type: object
    ParentLocation:
      description: 'Describes a parent location. Locations are hierarchical, mean a location has a parent, and

        a location may have any number of child locations. A parent location is often included with locations,

        which can help traverse the location tree.

        '
      properties:
        disassembledName:
          description: 'This is the short version of the location name, which does not include the suburb or other information.

            '
          type: string
        id:
          description: 'This is a unique ID for the returned location. Certain types of ID can be used for subsequent searches performed with `stop_finder`,

            or can be used as the origin or destination in an `trip` request. The format of a location ID differs greatly, depending

            on the type of location it is.

            '
          type: string
        name:
          description: 'This is the long version of the location name, which may include the suburb or other information.

            '
          type: string
        parent:
          $ref: '#/components/schemas/ParentLocation'
          description: 'In some cases, a parent location will also contain its parent (in other words, the grandparent of the initial location)

            '
        type:
          description: 'This is the type of location being returned. It may represent a stop or platform that a public transport service physically

            stops at for passenger boarding, or it may represent somebody''s house.

            A value of `unknown` likely indicates bad data coming from the server. If a location is returned with this type, you can safely ignore it.

            '
          enum:
          - poi
          - singlehouse
          - stop
          - platform
          - street
          - locality
          - suburb
          - unknown
          type: string
      type: object
    DepartureMonitorResponseStopEvent:
      description: 'Corresponds to a single departure or arrival for the given stop.

        '
      properties:
        departureTimePlanned:
          description: A timestamp in `YYYY-MM-DDTHH:MM:SSZ` format
          format: dateTime
          type: string
        infos:
          description: 'Contains a number of service alert messages relating to this stop event.

            Information returned here is also available using the `add_info` API endpoint.

            '
          items:
            $ref: '#/components/schemas/TripRequestResponseJourneyLegStopInfo'
          type: array
        location:
          $ref: '#/components/schemas/StopFinderLocation'
          description: 'This element contains a single location associated with this stop time.

            '
        transportation:
          $ref: '#/components/schemas/TripTransportation'
          description: 'This element describes the mode of transportation and/or the specific route or trip

            used for this stop time.

            '
      type: object
    AdditionalInfoResponseTimestamps:
      description: This element describes timestamps for a service alert.
      properties:
        availability:
          description: 'This describes when the alert should published. Note that this is used as guidance only and your own

            needs may vary.

            '
          properties:
            from:
              description: A timestamp in `YYYY-MM-DDTHH:MM:SSZ` format
              format: dateTime
              type: string
            to:
              description: A timestamp in `YYYY-MM-DDTHH:MM:SSZ` format
              format: dateTime
              type: string
          type: object
        creation:
          description: A timestamp in `YYYY-MM-DDTHH:MM:SSZ` format that indicates when the alert was created.
          format: dateTime
          type: string
        lastModification:
          description: A timestamp in `YYYY-MM-DDTHH:MM:SSZ` format that indicates when the alert was last modified.
          format: dateTime
          type: string
        validity:
          description: 'This describes when the incident is actually occurring.

            '
          items:
            properties:
              from:
                description: A timestamp in `YYYY-MM-DDTHH:MM:SSZ` format that indicates the starting date and time of this date range.
                format: dateTime
                type: string
              to:
                description: A timestamp in `YYYY-MM-DDTHH:MM:SSZ` format that indicates the ending date and time of this date range.
                format: dateTime
                type: string
            type: object
          type: array
      type: object
    ApiErrorResponse:
      description: 'This element contains information about an error that may have occurred when handling an API request.

        '
      properties:
        message:
          description: Describes the error that went wrong
          type: string
        versions:
          description: 'If the error was related to the API version, this element contains version information.

            '
          properties:
            controller:
              description: The version of the API handling the request
              type: string
            interfaceMax:
              description: The maximum version number that can be requested in the `version` request parameter.
              type: string
            interfaceMin:
              description: The minimum version number that can be requested in the `version` request parameter.
              type: string
          type: object
      type: object
    RouteProduct:
      description: This element contains additional properties about the route.
      properties:
        class:
          description: 'This field indicates the type of the route, using the same values

            as elsewhere in this API.


            * `1`: Train

            * `2`: Metro

            * `4`: Light Rail

            * `5`: Bus

            * `7`: Coach

            * `9`: Ferry

            * `11`: School Bus

            * `99`: Walking

            * `100`: Walking (Footpath)

            * `101`: Bicycle

            * `102`: Take Bicycle On Public Transport

