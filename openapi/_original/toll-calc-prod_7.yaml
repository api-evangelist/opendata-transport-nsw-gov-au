    TollPrice:
        properties:
            cost:
                example: 4.55
                format: double
                type: number
            id:
                example: 2
                format: int32
                type: integer
            roadname:
                example: M7
                type: string
            timeofDaytolling:
                example: false
                type: boolean
        type: object
    TotalCost:
        properties:
            breakdown:
                items:
                    $ref: '#/definitions/TollPrice'
                type: array
            totalCost:
                example: 13.66
                format: double
                type: number
        type: object
host: api.transport.nsw.gov.au
info:
    title: Toll Calculator
    version: '1.0'
paths:
    /toll_calc:
        post:
            consumes:
            - application/json
            operationId: getTollCostFromEncodedPolyUsingPOST
            parameters:
            -   description: Request object representing the journey
                in: body
                name: body
                required: true
                schema:
                    $ref: '#/definitions/Journey'
            produces:
            - application/json
            responses:
                '200':
                    description: successful operation
                    schema:
                        $ref: '#/definitions/TotalCost'
                '201':
                    description: Created
                '400':
                    description: Bad Request
                    schema:
                        $ref: '#/definitions/BadRequestResponse'
                '401':
                    description: Unauthorized
                '403':
                    description: Forbidden
                '404':
                    description: Not Found
            summary: Returns the toll cost breakdown for a journey
            tags:
            - pricing
security:
-   APIKey: []
securityDefinitions:
    APIKey:
        description: 'Expected Format: apikey [TOKEN]'
        in: header
        name: Authorization
        type: apiKey
swagger: '2.0'
tags:
-   description: the pricing API
    name: pricing-api-controller
