        breakdown:
          items:
            $ref: '#/components/schemas/TollPrice'
          type: array
        totalCost:
          example: 13.66
          format: double
          type: number
      type: object
    BadRequestResponse:
      properties:
        errorMessage:
          example: Date out of range
          type: string
      required:
      - errorMessage
      type: object
    VehicleClassByMotorway:
      properties:
        CCT:
          $ref: '#/components/schemas/VehicleClass'
        ED:
          $ref: '#/components/schemas/VehicleClass'
        LCT:
          $ref: '#/components/schemas/VehicleClass'
        M2:
          $ref: '#/components/schemas/VehicleClass'
        M4:
          $ref: '#/components/schemas/VehicleClass'
        M5:
          $ref: '#/components/schemas/VehicleClass'
        M7:
          $ref: '#/components/schemas/VehicleClass'
        SHB:
          $ref: '#/components/schemas/VehicleClass'
        SHT:
          $ref: '#/components/schemas/VehicleClass'
      type: object
    RouteApiResponse:
      properties:
        routes:
          items:
            $ref: '#/components/schemas/TollCalculationResponse'
          type: array
      type: object
    TollResponse:
      properties:
        chargeType:
          enum:
          - Fixed
          - TimeOfDay
          - Distance
          type: string
        charges:
          items:
            properties:
              chargeInCents:
                type: number
              vehicleClass:
                $ref: '#/components/schemas/VehicleClass'
            type: object
          type: array
        maxChargeInCents:
          type: number
        minChargeInCents:
          type: number
      type: object
    MatchApiResponse:
      properties:
        match:
          $ref: '#/components/schemas/TollCalculationResponse'
      type: object
    VehicleClass:
      enum:
      - A
      - B
      type: string
    Route:
      properties:
        departureTime:
          format: date-time
          type: string
        destination:
          $ref: '#/components/schemas/CoordinatesLocationName'
        excludeToll:
          default: false
          type: boolean
        includeSteps:
          default: false
          type: boolean
        origin:
          $ref: '#/components/schemas/CoordinatesLocationName'
        vehicleClass:
          $ref: '#/components/schemas/VehicleClass'
        vehicleClassByMotorway:
          $ref: '#/components/schemas/VehicleClassByMotorway'
      required:
      - origin
      - destination
      type: object
    TollCalculationResponse:
      properties:
        confidence:
          type: number
        distance:
          type: number
        duration:
          type: number
        geometry:
          type: string
        isCheapest:
          type: boolean
        isQuickest:
          type: boolean
        isShortest:
          type: boolean
        maxChargeInCents:
          type: number
        minChargeInCents:
          type: number
        summary:
          type: string
        tollsCharged:
          items:
            $ref: '#/components/schemas/TollResponse'
          type: array
      type: object
