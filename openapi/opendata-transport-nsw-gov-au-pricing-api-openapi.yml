openapi: 3.2.0
info:
  title: Opendata Transport Nsw Gov Au Pricing API
  version: '1.0'
  description: 'Operations tagged pricing across 4 of this provider''s published API definitions: toll-calc-prod_7.yaml, tollcalc_swagger_v01_0.yaml, opendata-transport-nsw-gov-au-toll-calculator-v1-openapi.yml, opendata-transport-nsw-gov-au-toll-calculator-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.transport.nsw.gov.au/v1/roads
- url: https://api.transport.nsw.gov.au/v2/roads
security:
- APIKey: []
tags:
- name: Pricing
paths:
  /toll_calc:
    post:
      operationId: getTollCostFromEncodedPolyUsingPOST
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotalCost'
        '201':
          description: Created
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Returns the toll cost breakdown for a journey
      tags:
      - Pricing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Journey'
        description: Request object representing the journey
        required: true
    servers:
    - url: https://api.transport.nsw.gov.au/v1/roads
  /toll_calc/data:
    get:
      operationId: getData
      responses:
        '200':
          description: successful operation
        '201':
          description: Created
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Get information about toll road pricing in NSW
      tags:
      - Pricing
    servers:
    - url: https://api.transport.nsw.gov.au/v2/roads
  /toll_calc/match:
    post:
      operationId: getMatch
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchApiResponse'
        '201':
          description: Created
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Returns the toll cost breakdown for the supplied route
      tags:
      - Pricing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Match'
        description: Request object representing the journey
        required: true
    servers:
    - url: https://api.transport.nsw.gov.au/v2/roads
  /toll_calc/route:
    post:
      operationId: getRoutes
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteApiResponse'
        '201':
          description: Created
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Returns possible routes between an origin and destination and the toll cost…
      tags:
      - Pricing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Route'
        description: Request object representing the journey
        required: true
    servers:
    - url: https://api.transport.nsw.gov.au/v2/roads
