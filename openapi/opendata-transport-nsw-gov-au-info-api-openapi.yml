- name: Info
paths:
  /info:
    get:
      tags:
      - Info
      summary: Static data for taxi ranks eg. location, operating hours
      operationId: info
      description: 'This feed provides identifying information for one or more taxi ranks.


        Information retuned includes location information and operating hours.


        Providing the rankId parameter with a valid rank ID will return the data for that one rank.

        Leaving the rankId parameter blank will return the live data for all stored taxi ranks.'
      parameters:
      - name: rankId
        in: query
        required: false
        schema:
          type: string
          default: ''
