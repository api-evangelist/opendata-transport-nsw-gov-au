openapi: 3.2.0
info:
  title: Opendata Transport Nsw Gov Au Coord API
  version: 10.6.21.17
  description: 'Operations tagged Coord across 2 of this provider''s published API definitions: tripplanner_v1_swag_efa11_20251002.yml, opendata-transport-nsw-gov-au-trip-planner-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.transport.nsw.gov.au/v1/tp
security:
- APIKey: []
tags:
- name: Coord
paths:
  /coord:
    get:
      description: 'This endpoint returns places of interest based on the given coordinate and a radius. The types of POIs can be controlled, so if, for example,

        you only want Opal resellers returned, you can do so.'
      operationId: tfnsw_coord_request
      parameters:
      - description: 'Used to set the response data type. This documentation only covers responses that use the JSON format.

          Setting the `outputFormat` value to `rapidJSON` is required to enable JSON output.

          '
        in: query
        name: outputFormat
        required: true
        schema:
          type: string
          enum:
          - rapidJSON
      - description: 'The coordinate is in the format `LONGITUDE:LATITUDE:EPSG:4326` (Note that longitude is first).

          For example, the following `coord` value can be used to search around Central Station: `151.206290:-33.884080:EPSG:4326`.

          '
        in: query
        name: coord
        required: true
        schema:
          type: string
          default: 151.206290:-33.884080:EPSG:4326
      - description: 'This specifies the format the coordinates are returned in. While other variations are available, the `EPSG:4326` format will return the widely-used format.

          '
        in: query
        name: coordOutputFormat
        required: true
        schema:
          type: string
          enum:
          - EPSG:4326
      - description: 'This enables "advanced filter mode" on the server, which is required to enable searching using coordinates.

          '
        in: query
        name: inclFilter
        required: true
        schema:
          type: integer
          enum:
          - 1
          default: 1
      - description: 'This specifies the type of items to return.


          * `GIS_POINT`: GIS points, including Opal resellers (see `inclDrawClasses_1`)

          * `BUS_POINT`: Stops/stations

          * `POI_POINT`: Places of interest


          The `_1` suffix is an index for this particular filter. You can specify multiple filters by incrementing the suffix

          for each combination of `type`, `radius` and `inclDrawClasses`. For example, `type_1` means the first filter, `type_2`

          refers to the second, and so on.

          '
        in: query
        name: type_1
        required: true
        schema:
          type: string
          enum:
          - GIS_POINT
          - BUS_POINT
          - POI_POINT
          default: GIS_POINT
      - description: 'This indicates the maximum number of metres to search in all directions from the location specified in `coord`. For example,

          if you use a value of `500`, a `type_1` value of `GIS_POINT` and `inclDrawClasses_1` with a value of `74`, all Opal resellers

          within 500 metres will be returned. The suffix of `_1` indicates this radius value corresponds to the `type_1` value. If multiple

          filters are to be included, the appropriate suffix should be updated accordingly.

          '
        in: query
        name: radius_1
        required: true
        schema:
          type: integer
          default: 1000
      - description: 'This flag changes the list of POIs that are returned. To return Opal resellers, set this value to `74`

          and `type_1` to `GIS_POINT`.The suffix of `_1` indicates this radius value corresponds to the `type_1` value.

          If multiple filters are to be included, the appropriate suffix should be updated accordingly.

          '
        in: query
        name: inclDrawClasses_1
        required: false
        schema:
          type: integer
          enum:
          - 74
      - description: 'This field indicates how the returned data is to be used, which in turn impacts whether or not certain locations are returned.

          '
        in: query
        name: PoisOnMapMacro
        required: false
        schema:
          type: string
          enum:
          - 'true'
          default: 'true'
      - allowEmptyValue: true
        description: 'Indicates which version of the API the caller is expecting for both request and response data. Note that if this version differs

          from the version listed above then the returned data may not be as expected.

          '
        in: query
        name: version
        required: false
        schema:
          type: string
          default: 10.2.1.42
      responses:
        200:
          description: A list of places of interest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoordRequestResponse'
        401:
          description: The application calling the API has not been authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
        500:
          description: An internal error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
        503:
          description: The server is currently unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
      summary: When given a specific geographical location, this API finds public transport…
      tags:
      - Coord
    servers:
    - url: https://api.transport.nsw.gov.au/v1/tp
components:
  schemas:
    CoordRequestResponseLocation:
      description: 'Describes a single point that is returned based on the given request.

        '
      properties:
        coord:
          description: 'Contains exactly two values: the first value is the latitude, the second value is the longitude.

            '
          items:
            format: double
            type: number
          type: array
        disassembledName:
          description: 'This is the short version of the location name, which does not include the suburb or other information.

            '
          type: string
        id:
          description: 'This is a unique ID for the returned location. Certain types of ID can be used for subsequent searches performed with `stop_finder`,

            or can be used as the origin or destination in an `trip` request. The format of a location ID differs greatly, depending

            on the type of location it is.

            '
          type: string
        name:
          description: 'Contains a human-readable title for the location.

            '
          type: string
        parent:
          $ref: '#/components/schemas/ParentLocation'
          description: 'If available, contains information about this location''s parent location. For example, if the

            stop has a type of `platform`, then this field may contain information about the station in which

            the platform is located.

            '
        properties:
          description: 'This data contains additional information about each location, mainly related to how

            it can be categorised or displayed on a map.

            '
          properties:
            GIS_DRAW_CLASS:
              description: 'This value indicates how the given point can be represented on a map. For example,

                if you have different icons for different categories, use this to determine which icon to use.


                * `CityL`

                * `CityM`

                * `CityS`

                * `CityXL`

                * `CityXS`

                * `Generic7`

                * `Generic8`

                * `Generic9`

                * `Generic20`

                * `PoiAirportPublic`

                * `PoiCemetry`

                * `PoiCulture`

                * `PoiGastro`

                * `PoiGeneral`

                * `PoiGovernment`

                * `PoiHistoric`

                * `PoiHotel`

                * `PoiMedicine`

                * `PoiOthers`

                * `PoiPark`

                * `PoiParking`

                * `PoiPublicBuilding`

                * `PoiReligion`

                * `PoiSchool`

                * `PoiSport`

                * `PoiSwimming`

                * `PoiTrafficSpecial`

                '
              type: string
            GIS_DRAW_CLASS_TYPE:
              description: This value typically either empty or `POINT`.
              enum:
              - POINT
              type: string
            GIS_NIVEAU:
              description: This data is not used at this time.
              type: string
            POI_DRAW_CLASS:
              description: 'This value indicates how the given point can be represented on a map. For example,

                if you have different icons for different categories, use this to determine which icon to use.


                * `PoiCemetry`

                * `PoiCulture`

                * `PoiGastro`

                * `PoiGeneral`

                * `PoiGovernment`

                * `PoiHotel`

                * `PoiMedicine`

                * `PoiOthers`

                * `PoiPark`

                * `PoiParking`

                * `PoiPublicBuilding`

                * `PoiReligion`

                * `PoiSchool`

                * `PoiSport`

                * `PoiSwimming`

                * `PoiTrafficSpecial`

                '
              type: string
            POI_DRAW_CLASS_TYPE:
              description: This value typically either empty or `POINT`.
              enum:
              - POINT
              type: string
            POI_HIERARCHY_0:
              description: 'This field contains a human-readable description of the category to which this

                location belongs. See the description for `POI_HIERARCHY_KEY` for example values that

                correspond to the given keys.

                '
              type: string
            POI_HIERARCHY_KEY:
              description: 'This field contains a constant value for the category to which this category belongs.


                * `A`: Accommodation

                * `B`: Caravan and Camping

                * `C`: Cemetary

                * `D`: Education

                * `E`: Emergency or Defence

                * `F`: Entertainment

                * `G`: Gardens or Parklands

                * `H`: Golf Clubs

                * `I`: Historical or Religious

                * `K`: Local Government

                * `L`: Medical and Care

                * `O`: Sporting or Recreation

                * `Q`: Tourist Attraction

                * `R`: Transport

                * `S`: Utilities and Facilities

                * `T`: Others

                '
              type: string
            distance:
              description: This is the distance in metres to this location from the search location.
              type: string
          type: object
        type:
          description: 'This specifies the type of the returned item. If you search with a type of `GIS_POINT`,

            a returned item has a type of `gisPoint`.

            '
          enum:
          - poi
          - singlehouse
          - stop
          - platform
          - street
          - locality
          - suburb
          - gisPoint
          - unknown
          type: string
      type: object
    HttpErrorResponse:
      description: 'This element contains information about a HTTP error that occurred.

        '
      properties:
        ErrorDateTime:
          description: The date and time that the error occurred.
          type: string
        Message:
          description: A detailed message about the error.
          type: string
        RequestedMethod:
          description: The HTTP request method used for the current request.
          type: string
        RequestedUrl:
          description: The URL for the current request.
          type: string
        TransactionId:
          description: A unique identifier for the current request.
          type: string
      type: object
    ParentLocation:
      description: 'Describes a parent location. Locations are hierarchical, mean a location has a parent, and

        a location may have any number of child locations. A parent location is often included with locations,

        which can help traverse the location tree.

        '
      properties:
        disassembledName:
          description: 'This is the short version of the location name, which does not include the suburb or other information.

            '
          type: string
        id:
          description: 'This is a unique ID for the returned location. Certain types of ID can be used for subsequent searches performed with `stop_finder`,

            or can be used as the origin or destination in an `trip` request. The format of a location ID differs greatly, depending

            on the type of location it is.

            '
          type: string
        name:
          description: 'This is the long version of the location name, which may include the suburb or other information.

            '
          type: string
        parent:
          $ref: '#/components/schemas/ParentLocation'
          description: 'In some cases, a parent location will also contain its parent (in other words, the grandparent of the initial location)

            '
        type:
          description: 'This is the type of location being returned. It may represent a stop or platform that a public transport service physically

            stops at for passenger boarding, or it may represent somebody''s house.

            A value of `unknown` likely indicates bad data coming from the server. If a location is returned with this type, you can safely ignore it.

            '
          enum:
          - poi
          - singlehouse
          - stop
          - platform
          - street
          - locality
          - suburb
          - unknown
          type: string
      type: object
    CoordRequestResponse:
      description: 'This is the response data returned when performing an `coord` request.

        '
      properties:
        error:
          $ref: '#/components/schemas/ApiErrorResponse'
          description: 'If an error has occurred, this element contains information about the error.

            '
        locations:
          description: 'This contains a list of all of the stops, reload points and places of interest found based on the given request.

            '
          items:
            $ref: '#/components/schemas/CoordRequestResponseLocation'
          type: array
        version:
          description: 'The version of the API that provided the response. Note that if this value is different to above, then the returned data may be

            different than expected. You can set the expected version using the `version` request parameter.

            '
          type: string
      type: object
    ApiErrorResponse:
      description: 'This element contains information about an error that may have occurred when handling an API request.

        '
      properties:
        message:
          description: Describes the error that went wrong
          type: string
        versions:
          description: 'If the error was related to the API version, this element contains version information.

            '
          properties:
            controller:
              description: The version of the API handling the request
              type: string
            interfaceMax:
              description: The maximum version number that can be requested in the `version` request parameter.
              type: string
            interfaceMin:
              description: The minimum version number that can be requested in the `version` request parameter.
              type: string
          type: object
      type: object
  securitySchemes:
    APIKey:
      description: 'Expected Format: apikey [TOKEN]'
      in: header
      name: Authorization
      type: apiKey
