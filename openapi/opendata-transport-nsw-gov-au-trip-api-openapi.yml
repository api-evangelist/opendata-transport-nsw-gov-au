openapi: 3.2.0
info:
  title: Opendata Transport Nsw Gov Au Trip API
  version: 10.6.21.17
  description: 'Operations tagged Trip across 2 of this provider''s published API definitions: tripplanner_v1_swag_efa11_20251002.yml, opendata-transport-nsw-gov-au-trip-planner-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.transport.nsw.gov.au/v1/tp
security:
- APIKey: []
tags:
- name: Trip
paths:
  /trip:
    get:
      description: 'This endpoint is used to find a list of journeys between two locations at the specified date and time. For example,

        if the user is at the Airport and wants to get to Manly using public transport but isn''t sure how exactly, this call

        will tell them exactly which train, bus, ferry or light rail to catch, and between which stops. It is extremely detailed,

        and includes the the specific path the vehicle(s) will take.'
      operationId: tfnsw_trip_request2
      parameters:
      - description: 'Used to set the response data type. This documentation only covers responses that use the JSON format.

          Setting the `outputFormat` value to `rapidJSON` is required to enable JSON output.

          '
        in: query
        name: outputFormat
        required: true
        schema:
          type: string
          enum:
          - rapidJSON
      - description: This specifies the format the coordinates are returned in. While other variations are available, the `EPSG:4326` format will return the widely-used format.
        in: query
        name: coordOutputFormat
        required: true
        schema:
          type: string
          enum:
          - EPSG:4326
      - description: 'This value anchors the requested date time. If set to `dep`, then trips *departing after* the specified date/time

          *at the specified location* are included.

          If set to `arr`, then trips *arriving before* the specified time *at its destination stop* are included. Works in conjunctions with the

          `itdDate` and `itdTime` values.

          '
        in: query
        name: depArrMacro
        required: true
        schema:
          type: string
          enum:
          - dep
          - arr
      - description: 'The reference date used when searching trips, in `YYYYMMDD` format. For instance, `20160901` refers to

          1 September 2016. Works in conjunction with the `itdTime` and `depArrMacro` values. If not specified, the current server date is used.

          '
        in: query
        name: itdDate
        required: false
        schema:
          type: string
          default: 20161001
      - description: 'The reference time used when searching trips, in `HHMM` 24-hour format. For instance, `2215` refers to 10:15 PM. |

          Works in conjunction with the `itdDate` and `depArrMacro` values. If not specified, the current server time is used.

          '
        in: query
        name: itdTime
        required: false
        schema:
          type: string
          default: 1200
      - description: 'This is the type of data specified in the `name_origin` field. The origin indicates the starting point when searching for journeys.

          The best way to use the trip planner is to use use `any` for this field then specify a valid location ID in `type_origin`, or to use `coord`

          in this field and a correctly formatted coordinate in `type_origin`.

          '
        in: query
        name: type_origin
        required: true
        schema:
          type: string
          enum:
          - any
          - coord
          default: any
      - description: 'This value is used to indicate the starting point when searching for journeys.

          This value can be one of three things:

          A valid location/stop ID (for example, `10101100` indicates Central Station - this can be determined using `stop_finder`).

          A valid global stop ID (for example, `200060` indicates Central Station - this can be determined using `stop_finder`)

          Coordinates in the format `LONGITUDE:LATITUDE:EPSG:4326` (Note that longitude is first).

          '
        in: query
        name: name_origin
        required: true
        schema:
          type: string
          default: 10101331
      - description: 'This is the type of data specified in the `name_destination` field. The origin indicates the finishing point when searching for journeys.

          The best way to use the trip planner is to use use `any` for this field then specify a valid location ID in `type_destination`, or to use `coord`

          in this field and a correctly formatted coordinate in `type_destination`.

          '
        in: query
        name: type_destination
        required: true
        schema:
          type: string
          enum:
          - any
          - coord
          default: any
      - description: 'This value is used to indicate the finishing point when searching for journeys.

          This value can be one of three things:

          A valid location/stop ID (for example, `10101100` indicates Central Station - this can be determined using `stop_finder`).

          A valid global stop ID (for example, `200060` indicates Central Station - this can be determined using `stop_finder`)

          Coordinates in the format `LONGITUDE:LATITUDE:EPSG:4326` (Note that longitude is first).

          '
        in: query
        name: name_destination
        required: true
        schema:
          type: string
          default: 10102027
      - description: 'This parameter indicates the maximum number of trips to returned. Fewer trips may be returned anyway,

          depending on the available public transport services.

          '
        in: query
        name: calcNumberOfTrips
        required: false
        schema:
          type: integer
          default: 6
      - description: 'Including this parameter (regardless of its value) ensures that only wheelchair-accessible options are returned.

          '
        in: query
        name: wheelchair
        required: false
        schema:
          type: string
          enum:
          - 'on'
      - description: 'This parameter which means of transport to exclude from the trip plan. To exclude one means, select one of the following: `1` = train, `2` = metro, `4` = light rail, `5` = bus, `7` = coach, `9` = ferry, `11` = school bus. `checkbox` allows you to exclude more than one means of transport when used in conjunction with the `exclMOT_<ID>` parameters.

          '
        in: query
        name: excludedMeans
        required: false
        schema:
          type: string
          enum:
          - checkbox
          - '1'
          - '2'
          - '4'
          - '5'
          - '7'
          - '9'
          - '11'
      - description: 'Excludes train services from the trip plan.  Must be used in conjunction with `excludedMeans=checkbox`

          '
        in: query
        name: exclMOT_1
        required: false
        schema:
          type: string
          enum:
          - '1'
      - description: 'Excludes metro services from the trip plan.  Must be used in conjunction with `excludedMeans=checkbox`

          '
        in: query
        name: exclMOT_2
        required: false
        schema:
          type: string
          enum:
          - '1'
      - description: 'Excludes light rail services from the trip plan.  Must be used in conjunction with `excludedMeans=checkbox`

          '
        in: query
        name: exclMOT_4
        required: false
        schema:
          type: string
          enum:
          - '1'
      - description: 'Excludes bus services from the trip plan.  Must be used in conjunction with `excludedMeans=checkbox`

          '
        in: query
        name: exclMOT_5
        required: false
        schema:
          type: string
          enum:
          - '1'
      - description: 'Excludes coach services from the trip plan.  Must be used in conjunction with `excludedMeans=checkbox`

          '
        in: query
        name: exclMOT_7
        required: false
        schema:
          type: string
          enum:
          - '1'
      - description: 'Excludes ferry services from the trip plan.  Must be used in conjunction with `excludedMeans=checkbox`

          '
        in: query
        name: exclMOT_9
        required: false
        schema:
          type: string
          enum:
          - '1'
      - description: 'Excludes school bus services from the trip plan.  Must be used in conjunction with `excludedMeans=checkbox`

          '
        in: query
        name: exclMOT_11
        required: false
        schema:
          type: string
          enum:
          - '1'
      - allowEmptyValue: true
        description: 'Including this parameter enables a number of options that result in this API call operating in the same way as the Transport for NSW Trip Planner web site, including enabling real-time data.

          '
        in: query
        name: TfNSWTR
        required: false
        schema:
          type: string
          enum:
          - 'true'
          default: 'true'
      - allowEmptyValue: true
        description: 'Indicates which version of the API the caller is expecting for both request and response data. Note that if this version differs

          from the version listed above then the returned data may not be as expected.

          '
        in: query
        name: version
        required: false
        schema:
          type: string
          default: 10.2.1.42
      - description: 'This parameter activates the options for individual transport. If the parameter is disabled, the parameters concerning individual transport will not be taken into account. possible values are 0 and 1

          '
        in: query
        name: itOptionsActive
        required: false
        schema:
          type: integer
          default: 1
      - description: 'Activates the calculation of a monomodal trip, i.e., a trip that takes place exclusively with the means of transport <means of transport>, e.g., with bicycle. Note 1: In order to use this parameter, the options for individual transport must be activated with itOptionsActive=1. Note 2: If no monomodal trip with the means of transport <means of transport> is calculated despite the parameter, the maximum time is often set too low. The parameter MaxITTime applies to all means of transport, the parameter MaxITTime<means of transport>to the means of transport <means of transport> (e.g., MaxITTime107). These parameters are located in the [Parameters] section or are added to it. The configuration can be alternatively overridden bythe maxTime<Transport means> parameter.

          '
        in: query
        name: computeMonomodalTripBicycle
        required: false
        schema:
          type: boolean
      - description: 'The value of the <speed> parameter is used to specify the speed of cycle travel in kilometers per hour.Note: In order to use this parameter, the options for individual transport must be activated with itOptionsActive=1. If the parameter is to be specified together with a profile, the bikeProfSpeed parameter can be used.The parameter “''cycleSpeed” specifies the desired real speed of the user for the bike route, which overwrites the speed in the SpeedSettings of the corresponding “bikeProfSpeed”.

          '
        in: query
        name: cycleSpeed
        required: false
        schema:
          type: integer
          default: 16
      - description: 'With the parameter ''bikeProfSpeed'' a bike profile name is passed

          '
        in: query
        name: bikeProfSpeed
        required: false
        schema:
          type: string
          enum:
          - EASIER
          - MODERATE
          - MOST_DIRECT
      - description: 'The value of the this parameter sets the maximum time to be covered by the means of cycling. The time is specified in minutes. Note: To use this parameter, the options for individual transport must be enabled with itOptionsActive=1

          '
        in: query
        name: maxTimeBicycle
        required: false
        schema:
          type: integer
      - description: 'Restricts the calculation to trips with the bikes only. Note: To be able to use this parameter, the options for individual transport must be activated with itOptionsActive=1. Possible values are 1, true, on

          '
        in: query
        name: onlyITBicycle
        required: false
        schema:
          type: integer
      - description: 'If this parameter is active, the elevation data is taken into account in the trip calculation for all means of transport and output in a route description for each individual transport section. Note: To be able to use this parameter, the options for individual transport must be activated with itOptionsActive=1. Possible values are 1, true, on

          '
        in: query
        name: useElevationData
        required: false
        schema:
          type: integer
      - description: 'This parameter specifies the maximum slope for bike routes. Roads with a slope greater than the specified?? one are avoided. The slope is specified by a factor <factor> whose value range is [0..100]. By default, the value of the parameter is 50

          '
        in: query
        name: elevFac
        required: false
        schema:
          type: integer
      responses:
        200:
          description: A list of suggested journeys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripRequestResponse'
        401:
          description: The application calling the API has not been authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
        500:
          description: An internal error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
        503:
          description: The server is currently unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
      summary: Provides capability to provide NSW public transport trip plan options…
      tags:
      - Trip
    servers:
    - url: https://api.transport.nsw.gov.au/v1/tp
components:
  schemas:
    RouteProduct:
      description: This element contains additional properties about the route.
      properties:
        class:
          description: 'This field indicates the type of the route, using the same values

            as elsewhere in this API.


            * `1`: Train

            * `2`: Metro

            * `4`: Light Rail

            * `5`: Bus

            * `7`: Coach

            * `9`: Ferry

            * `11`: School Bus

            * `99`: Walking

            * `100`: Walking (Footpath)

            * `101`: Bicycle

            * `102`: Take Bicycle On Public Transport

            * `103`: Kiss & Ride

            * `104`: Park & Ride

            * `105`: Taxi

            * `106`: Car

            '
          type: integer
        iconId:
          description: 'This field is used by to determine which icon to use when displaying

            this affected route. It will typically match up with the `class` value.

            '
          type: integer
        name:
          description: Name of the product
          type: string
      type: object
    TripRequestResponseJourneyLegInterchange:
      description: 'This object describes walking directions for interchanging between two consecutive legs. This

        occurs in the case when there''s only a small distance between two transit legs, not enough

        to constitute a standalone walking leg.

        '
      properties:
        coords:
          description: 'This is a list of coordinates that makes up the path of the interchange.

            '
          items:
            description: 'Contains exactly two values: the first value is the latitude, the second value is the longitude.

              '
            items:
              format: double
              type: number
            type: array
          type: array
        desc:
          description: 'This is a description of the interchange.

            '
          type: string
        type:
          description: 'This indicates the mode of travel for the interchange. Both `99` and `100` indicate walking.

            '
          enum:
          - 99
          - 100
          type: integer
      type: object
    ParentLocation:
      description: 'Describes a parent location. Locations are hierarchical, mean a location has a parent, and

        a location may have any number of child locations. A parent location is often included with locations,

        which can help traverse the location tree.

        '
      properties:
        disassembledName:
          description: 'This is the short version of the location name, which does not include the suburb or other information.

            '
          type: string
        id:
          description: 'This is a unique ID for the returned location. Certain types of ID can be used for subsequent searches performed with `stop_finder`,

            or can be used as the origin or destination in an `trip` request. The format of a location ID differs greatly, depending

            on the type of location it is.

            '
          type: string
        name:
          description: 'This is the long version of the location name, which may include the suburb or other information.

            '
          type: string
        parent:
          $ref: '#/components/schemas/ParentLocation'
          description: 'In some cases, a parent location will also contain its parent (in other words, the grandparent of the initial location)

            '
        type:
          description: 'This is the type of location being returned. It may represent a stop or platform that a public transport service physically

            stops at for passenger boarding, or it may represent somebody''s house.

            A value of `unknown` likely indicates bad data coming from the server. If a location is returned with this type, you can safely ignore it.

            '
          enum:
          - poi
          - singlehouse
          - stop
          - platform
          - street
          - locality
          - suburb
          - unknown
          type: string
      type: object
    TripRequestResponseJourneyLegStopInfo:
      description: 'This element describes a single information message that may be associated with a journey leg.

        The data in this is similar to that from `add_info`, but is presented differently.

        '
      properties:
        content:
          description: 'This is the descriptive alert content. It may contain HTML tags and/or HTML entities.

            '
          type: string
        id:
          description: 'This is a unique identifier for this particular service alert. Note that this same ID is used in

            `add_info` for the same alert.

            '
          type: string
        priority:
          description: 'This value indicates how important the service alert is. A value of `high` or `veryHigh` likely indicates that

            the alert will correspond to an event that impacts the ability to travel for relevant users, while `low` or `veryLow`

            might be more of an informational message.

            '
          enum:
          - veryLow
          - low
          - normal
          - high
          - veryHigh
          type: string
        subtitle:
          description: 'This is short summary that can be used as a heading for the alert content. It may contain HTML tags and/or HTML entities.

            '
          type: string
        timestamps:
          $ref: '#/components/schemas/AdditionalInfoResponseTimestamps'
          description: 'This contains a number of timestamps that describe when the alert was created, and when the described alert actually

            takes place and/or is relevant.

            '
        url:
          description: 'This field contains a URL that contains additional information about the alert. This value is equivalent to

            the `infoLinkURL` value in `add_info`.

            '
          type: string
        urlText:
          description: 'This field contains a title that can be used when displaying the `url` URL. This value is equivalent to

            the `infoLinkText` value in `add_info`.

            '
          type: string
        version:
          description: 'This number indicates the version of this alert. Initially when it is created it has version `1`, but if it is then

            updated it will have a new `lastModification` value and the version will now be `2`.

            '
          type: integer
      type: object
    TripRequestResponseJourneyLegStopFootpathInfo:
      description: Contains walking directions for a walking leg.
      properties:
        duration:
          description: 'This is approximately how long in seconds the walking instructions contained in this element take to perform.

            '
          type: integer
        footPathElem:
          description: 'This describes the specific instructions for the walking leg.

            '
          items:
            $ref: '#/components/schemas/TripRequestResponseJourneyLegStopFootpathInfoFootpathElem'
          type: array
        position:
          description: 'This indicates where in the leg the walking part of this legs occurs, since for some legs this

            is included with transportation on a vehicle.

            '
          enum:
          - BEFORE
          - AFTER
          - IDEST
          type: string
      type: object
    TripRequestResponseJourneyLegStopFootpathInfoFootpathElemLocation:
      description: This element describes a starting or finishing point for a walking instruction.
      properties:
        area:
          description: This is an internal value used to group stops together.
          type: integer
        georef:
          description: 'This is an identifier for this particular instruction / location, based on its location.

            '
          type: string
        location:
          description: 'This includes information about the location in which this instruction takes place.

            '
          properties:
            coord:
              description: 'Contains exactly two values: the first value is the latitude, the second value is the longitude.

                Although multiple instructions may reference the same location, this coordinate is specific

                to this particular instruction.

                '
              items:
                format: double
                type: number
              type: array
            id:
              description: This the unique ID for the stop in which this instruction occurs.
              type: string
            type:
              description: This is the type of location in which this instruction occurs.
              enum:
              - poi
              - singlehouse
              - stop
              - platform
              - street
              - locality
              - suburb
              - unknown
              type: string
          type: object
        platform:
          description: 'If available, this is a platform number that relates to this instruction. It defaults to `0` if

            there is no such information available.

            '
          type: integer
      type: object
    TripRequestResponseJourneyLegStopDownload:
      description: Describes a single download available for this journey stop.
      properties:
        type:
          description: 'This indicates what type of download this is. For example, `RM` refers to Route Map.

            '
          type: string
        url:
          description: 'This is the URL for the download.

            '
          type: string
      type: object
    TripRequestResponseJourneyLeg:
      description: This element describes a single leg of a journey. A journey is made up of one or more legs.
      properties:
        coords:
          description: 'This elements contains a list of coordinates that this journey leg follows. A line between

            can be plotted between these coordinates in order when representing the journey on a map

            in order to show where the vehicle travels (or for a walking leg, the path to be walked).

            '
          items:
            description: 'Contains exactly two values: the first value is the latitude, the second value is the longitude.

              '
            items:
              format: double
              type: number
            type: array
          type: array
        destination:
          $ref: '#/components/schemas/TripRequestResponseJourneyLegStop'
          description: This is the finishing location of the leg.
        distance:
          description: The approximate distance in metres travelled to complete this journey leg.
          type: integer
        duration:
          description: The approximate amount of time in seconds required to complete this journey leg.
          type: integer
        footPathInfo:
          description: 'If the leg corresponds to a walking leg, this element contains walking directions.

            '
          items:
            $ref: '#/components/schemas/TripRequestResponseJourneyLegStopFootpathInfo'
          type: array
        hints:
          description: Contains a number of additional informational messages that may be useful for travellers.
          items:
            properties:
              infoText:
                description: 'Contains additional information that may be useful for travellers.

                  '
                type: string
            type: object
          type: array
        infos:
          description: 'Contains a number of service alert messages relating to this journey leg.

            Information returned here is also available using the `add_info` API endpoint.

            '
          items:
            $ref: '#/components/schemas/TripRequestResponseJourneyLegStopInfo'
          type: array
        interchange:
          $ref: '#/components/schemas/TripRequestResponseJourneyLegInterchange'
          description: 'Contains information for how to interchange between the end of one leg to the next journey leg.

            '
        isRealtimeControlled:
          description: This indicates whether or not real-time data has been used to calculate the departure/arrival timestamps
          type: boolean
        origin:
          $ref: '#/components/schemas/TripRequestResponseJourneyLegStop'
          description: This is the starting location of the leg.
        pathDescriptions:
          description: Contains walking information for completing this journey leg.
          items:
            $ref: '#/components/schemas/TripRequestResponseJourneyLegPathDescription'
          type: array
        properties:
          description: 'Contains additional information about this journey leg, such as wheelchair accessibility information.

            '
          properties:
            DIFFERENT_FARES:
              description: XXX
              type: string
            PlanLowFloorVehicle:
              description: This indicates whether or not the vehicle is wheelchair accessible.
              type: string
            PlanWheelChairAccess:
              description: This indicates whether or not the stop is wheelchair accessible.
              type: string
            lineType:
              description: 'XXX seen a value of SUPPLEMENT for ferry route

                '
              type: string
            vehicleAccess:
              description: This value is not currently in use.
              items:
                type: string
              type: array
          type: object
        stopSequence:
          description: 'This is a list of all stops that are made for this leg. It is sorted in order of its

            stopping sequence. If the leg is a walking leg between two stops, then this will contain

            these two stops in order.

            '
          items:
            $ref: '#/components/schemas/TripRequestResponseJourneyLegStop'
          type: array
        transportation:
          $ref: '#/components/schemas/TripTransportation'
          description: 'This element contains information about the mode of transport and/or route

            used to complete this journey leg.

            '
      type: object
    TripRequestResponse:
      description: This element contains the response from an `trip` request.
      properties:
        error:
          $ref: '#/components/schemas/ApiErrorResponse'
          description: 'If an error has occurred, this element contains information about the error.

            '
        journeys:
          description: Contains zero or more journeys found based on the input parameters.
          items:
            $ref: '#/components/schemas/TripRequestResponseJourney'
          type: array
        systemMessages:
          description: Includes system messages that may be relevant to this particular request.
          properties:
            responseMessages:
              description: Contains zero or more messages.
              items:
                $ref: '#/components/schemas/TripRequestResponseMessage'
              type: array
          type: object
        version:
          description: 'The version of the API that provided the response. Note that if this value is different to above, then the returned data may be

            different than expected. You can set the expected version using the `version` request parameter.

            '
          type: string
      type: object
    TripRequestResponseJourney:
      description: This element describes a single journey returned by `trip`
      properties:
        isAdditional:
          description: XXX
          type: boolean
        legs:
          description: This element contains one or more legs that constitute the trip.
          items:
            $ref: '#/components/schemas/TripRequestResponseJourneyLeg'
          type: array
        rating:
          description: XXX
          type: integer
      type: object
    TripRequestResponseJourneyLegStop:
      description: 'Contains information about a single stop in the journey leg.

        Typically, the first stop in a journey leg will only include departure time information,

        while the last stop in a journey leg will only include arrival time information. Stops in between

        will include both arrival and departure time information.

        '
      properties:
        arrivalTimeEstimated:
          description: 'A timestamp in `YYYY-MM-DDTHH:MM:SSZ` format that indicates the estimated arrival time. If real-time

            information is available then this timestamp is the real-time estimate, otherwise it is the same as the

            value in `arrivalTimePlanned`.

            '
          format: dateTime
          type: string
        arrivalTimePlanned:
          description: 'A timestamp in `YYYY-MM-DDTHH:MM:SSZ` format that indicates the planned arrival time. This is

            the original scheduled time.

            '
          format: dateTime
          type: string
        coord:
          description: 'Contains exactly two values: the first value is the latitude, the second value is the longitude.

            '
          items:
            format: double
            type: number
          type: array
        departureTimeEstimated:
          description: 'A timestamp in `YYYY-MM-DDTHH:MM:SSZ` format that indicates the estimated departure time. If real-time

            information is available then this timestamp is the real-time estimate, otherwise it is the same as the

            value in `departureTimePlanned`.

            '
          format: dateTime
          type: string
        departureTimePlanned:
          description: 'A timestamp in `YYYY-MM-DDTHH:MM:SSZ` format that indicates the planned departure time. This is

            the original scheduled time.

            '
          format: dateTime
          type: string
        disassembledName:
          description: 'This is the short version of the location name, which does not include the suburb or other information.

            '
          type: string
        id:
          description: 'This is a unique ID for the returned location. Certain types of ID can be used for subsequent searches performed with `stop_finder`,

