openapi: 3.2.0
info:
  title: Opendata Transport Nsw Gov Au Buses API
  version: '1.0'
  description: 'Operations tagged buses across 6 of this provider''s published API definitions: getschedule-busextension_2.6.json, v2-gtfs-alerts-swaggerprod_1.yaml, opendata-transport-nsw-gov-au-gtfs-realtime-alerts-v2-openapi.yml, opendata-transport-nsw-gov-au-gtfs-realtime-trip-updates-v1-openapi.yml, opendata-transport-nsw-gov-au-gtfs-realtime-vehicle-positions-v1-openapi.yml, opendata-transport-nsw-gov-au-gtfs-schedule-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.transport.nsw.gov.au/v1/gtfs/schedule
- url: https://api.transport.nsw.gov.au/v2/gtfs/alerts
- url: https://api.transport.nsw.gov.au/v1/gtfs/realtime
- url: https://api.transport.nsw.gov.au/v1/gtfs/vehiclepos
security:
- APIKey: []
tags:
- name: buses
paths:
  /buses:
    get:
      tags:
      - buses
      summary: GTFS timetables, stops, and route shapes for Buses
      operationId: GetBuses
      description: 'Please see the General Transit Feed Specification (GTFS) documentation here: https://gtfs.org/


        Please review the Real time Buses Technical Documentation - https://opendata.transport.nsw.gov.au/documentation


        For agency details, please refer to the ‘Overlapping agencies in GTFS feeds’ table, ‘For Realtime GTFS static timetable parameter’ column on https://opendata.transport.nsw.gov.au/reference-tables


        Returns ZIP file containing CSV files.


        The HEAD operation can be used to tell you if the content has changed (as GET may not return an HTTP 304 when no content has changed.)


        For example, you may compare the Last-Modified header retrieved during a HEAD operation with the Last-Modified header retrieved during a previous GET operation. If the headers are the same, the content has not changed since the previous GET operation. If the headers are different, the content has changed since the previous GET operation.'
      responses:
        '200':
          description: The request has been processed successfully.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: The application calling the API has not been authenticated.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: The requested resource could not be found.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: An internal error has occurred.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '503':
          description: The server is currently unavailable.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
    servers:
    - url: https://api.transport.nsw.gov.au/v1/gtfs/schedule
