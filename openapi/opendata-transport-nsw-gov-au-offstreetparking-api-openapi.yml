openapi: 3.2.0
info:
  title: Opendata Transport Nsw Gov Au Offstreetparking API
  version: '1.0'
  description: 'Operations tagged offstreetparking across 2 of this provider''s published API definitions: parking.json, opendata-transport-nsw-gov-au-off-street-parking-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.transport.nsw.gov.au/v1/roads/static
security:
- APIKey: []
tags:
- name: offstreetparking
paths:
  /offstreetparking:
    get:
      tags:
      - offstreetparking
      summary: Off-street parking data
      operationId: GetOffStreetParking
      description: 'Parking spaces that are available for service and delivery drivers in Sydney''s CBD (at commercial rates) in GeoJSON and CSV formats


        Please see the GeoJSON documentation here: http://geojson.org/


        Please review the data definition guide for Off-street parking data: https://opendata.transport.nsw.gov.au/Users/dev/Documents/Transport/WADL/loadingzones.wadl.


        The API or dataset includes Sydney CBD''s major parking providers and includes information for over 20,000 off street parking spaces.'
      responses:
        '200':
          description: The request has been processed successfully.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: The application calling the API has not been authenticated.
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: The requested resource could not be found.
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: An internal error has occured.
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '503':
          description: The server is currently unavailable.
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
    servers:
    - url: https://api.transport.nsw.gov.au/v1/roads/static
components:
  schemas:
    ErrorDetails:
      type: object
      description: Error response
      properties:
        TransactionId:
          type: string
        ErrorDateTime:
          type: string
        Message:
          type: string
        RequestedUrl:
          type: string
        RequestedMethod:
          type: string
      example:
        ErrorDetails:
          TransactionId: XXXXXXXXXX
          ErrorDateTime: XXXXXXXXXX
          Message: XXXXXXXXXX
          RequestedUrl: XXXXXXXXXX
          RequestedMethod: GET
  securitySchemes:
    APIKey:
      type: apiKey
      name: Authorization
      in: header
      description: 'Expected Format: apikey [TOKEN]'
