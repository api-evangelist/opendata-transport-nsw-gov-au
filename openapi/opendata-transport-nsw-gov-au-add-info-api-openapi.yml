openapi: 3.2.0
info:
  title: Opendata Transport Nsw Gov Au Add Info API
  version: 10.6.21.17
  description: 'Operations tagged Add Info across 2 of this provider''s published API definitions: tripplanner_v1_swag_efa11_20251002.yml, opendata-transport-nsw-gov-au-trip-planner-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.transport.nsw.gov.au/v1/tp
security:
- APIKey: []
tags:
- name: Add Info
paths:
  /add_info:
    get:
      description: 'This endpoint returns a list of service alerts or additional information about travelling on the public transport

        network. This list can be filtered by date, route type, route, operator or stop.'
      operationId: tfnsw_addinfo_request
      parameters:
      - description: 'Used to set the response data type. This documentation only covers responses that use the JSON format.

          Setting the `outputFormat` value to `rapidJSON` is required to enable JSON output.

          '
        in: query
        name: outputFormat
        required: true
        schema:
          type: string
          enum:
          - rapidJSON
      - description: 'This parameter allows you to filter the returned items that are only valid on the specified date. The format of

          this field is `DD-MM-YYYY`. For example, 12 September 2016 would be represented by `12-09-2016`.

          '
        in: query
        name: filterDateValid
        required: false
        schema:
          type: string
          default: 01-10-2016
      - description: 'This parameter allows you to filter the returned items by the modes of transport they affected. Available modes include:


          * `1`: Train

          * `2`: Metro

          * `4`: Light Rail

          * `5`: Bus

          * `7`: Coach

          * `9`: Ferry

          * `11`: School Bus


          To search for more than one mode, include the parameter multiple times.

          '
        in: query
        name: filterMOTType
        required: false
        schema:
          type: integer
          enum:
          - 1
          - 2
          - 4
          - 5
          - 7
          - 9
          - 11
      - description: 'This field can be used so only current alerts are returned, and not historic alerts.

          '
        in: query
        name: filterPublicationStatus
        required: false
        schema:
          type: string
          enum:
          - current
      - description: 'This parameter allows you to filter the returned items by its stop ID or global stop ID. For example, to retrieve items that are only

          relevant to Central Station, you would set this value to `10111010` (stop ID) or `200060` (global stop ID). You can use the `stop_finder` API call

          to determine the ID for a particular stop.

          '
        in: query
        name: itdLPxx_selStop
        required: false
        schema:
          type: string
      - description: 'This parameter allows you to filter the returned items by line number. For example, `020T1`. You can use this parameter

          multiple times if you want to search for more than one line number.

          '
        in: query
        name: itdLPxx_selLine
        required: false
        schema:
          type: string
      - description: 'This parameter allows you to filter the returned items by operator ID. You can use this parameter

          multiple times if you want to search for more than one line number.

          '
        in: query
        name: itdLPxx_selOperator
        required: false
        schema:
          type: string
      - description: 'This parameter allows you to filter the returned items by specific routes. The route is provided in the format `NNN:LLLLL:D`,

          (NNN: subnet, LLLLL: Route number, D: direction `H`/`R`). You can use this parameter

          multiple times if you want to search for more than one line number.

          '
        in: query
        name: filterPNLineDir
        required: false
        schema:
          type: string
      - description: 'This parameter allows you to filter the returned items by specific routes. The route is provided in the format `NNN:LLLLL:E`,

          (NNN: subnet, LLLLL: Route number, E: supplement). You can use this parameter

          multiple times if you want to search for more than one line number.

          '
        in: query
        name: filterPNLineSub
        required: false
        schema:
          type: string
      - allowEmptyValue: true
        description: 'Indicates which version of the API the caller is expecting for both request and response data. Note that if this version differs

          from the version listed above then the returned data may not be as expected.

          '
        in: query
        name: version
        required: false
        schema:
          type: string
          default: 10.2.1.42
      responses:
        200:
          description: A list of informational messages related to current or previous outages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdditionalInfoResponse'
        401:
          description: The application calling the API has not been authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
        500:
          description: An internal error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
        503:
          description: The server is currently unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
      summary: Provides capability to display all public transport service status and incident…
      tags:
      - Add Info
    servers:
    - url: https://api.transport.nsw.gov.au/v1/tp
components:
  schemas:
    AdditionalInfoResponseAffectedStop:
      description: This element describes a single stop that is affected by a service alert.
      properties:
        id:
          description: 'This the unique ID of the stop that is affected. It is the same ID that is

            used elsewhere in the system, such as in `trip` or

            `stop_finder`.

            '
          type: string
        name:
          description: This is the title of the affected stop.
          type: string
        parent:
          $ref: '#/components/schemas/ParentLocation'
          description: 'If available, contains information about this location''s parent location. For example, if the

            stop has a type of `platform`, then this field may contain information about the station in which

            the platform is located.

            '
        type:
          description: The type of the location that is affected.
          enum:
          - poi
          - singlehouse
          - stop
          - platform
          - street
          - locality
          - suburb
          - gisPoint
          - unknown
          type: string
      type: object
    AdditionalInfoResponse:
      description: 'This is the response data returned when performing an `add_info` request.

        '
      properties:
        error:
          $ref: '#/components/schemas/ApiErrorResponse'
          description: 'If an error has occurred, this element contains information about the error.

            '
        infos:
          description: 'Contains each of the returned service alerts.

            '
          properties:
            affected:
              description: 'This specifies the list of affected stops and lines. It is an aggregate of each of the affected

                stops and lines listed in the alerts.

                '
              properties:
                lines:
                  description: The specifies all of the lines that are listed as affected in the alert information.
                  items:
                    $ref: '#/components/schemas/AdditionalInfoResponseAffectedLine'
                  type: array
                stops:
                  description: The specifies all of the stops that are listed as affected in the alert information.
                  items:
                    $ref: '#/components/schemas/AdditionalInfoResponseAffectedStop'
                  type: array
              type: object
            current:
              description: This specifies the list of current service alerts based on the specified filters.
              items:
                $ref: '#/components/schemas/AdditionalInfoResponseMessage'
              type: array
            historic:
              description: This specifies the list of previous service alerts based on the specified filters.
              items:
                $ref: '#/components/schemas/AdditionalInfoResponseMessage'
              type: array
          type: object
        timestamp:
          description: A timestamp in `YYYY-MM-DDTHH:MM:SSZ` format
          format: dateTime
          type: string
        version:
          description: 'The version of the API that provided the response. Note that if this value is different to above, then the returned data may be

            different than expected. You can set the expected version using the `version` request parameter.

            '
          type: string
      type: object
    AdditionalInfoResponseMessage:
      description: This element describes a single service alert.
      properties:
        affected:
          description: 'This contains details about the lines and stops that are impacted by the described alert.

            '
          properties:
            lines:
              description: This element contains a list of lines affected by this alert.
              items:
                $ref: '#/components/schemas/AdditionalInfoResponseAffectedLine'
              type: array
            stops:
              description: This element contains a list of stops affected by this alert.
              items:
                $ref: '#/components/schemas/AdditionalInfoResponseAffectedStop'
              type: array
          type: object
        content:
          description: 'This is the descriptive alert content. It may contain HTML tags and/or HTML entities.

            '
          type: string
        id:
          description: 'This is a unique identifier for this particular service alert.

            '
          type: string
        priority:
          description: 'This value indicates how important the service alert is. A value of `high` or `veryHigh` likely indicates that

            the alert will correspond to an event that impacts the ability to travel for relevant users, while `low` or `veryLow`

            might be more of an informational message.

            '
          enum:
          - veryLow
          - low
          - normal
          - high
          - veryHigh
          type: string
        properties:
          description: 'This element contains a additional information about the alert.

            '
          properties:
            providerCode:
              description: 'This field uniquely identifies which operator or organisation entered the alert into the system.

                '
              type: string
            smsText:
              description: 'This is a plaintext summary of the alert content, although note that it may contain HTML entities such as &nbsp;.

                '
              type: string
            source:
              description: Contains information about who created this alert.
              properties:
                id:
                  description: A unique identifier for the creator of this alert.
                  type: string
                name:
                  description: The name of the creator of this alert.
                  type: string
                type:
                  description: The type of system of the alert creator.
                  type: string
              type: object
          type: object
        subtitle:
          description: 'This is short summary that can be used as a heading for the alert content. It may contain HTML tags and/or HTML entities.

            '
          type: string
        timestamps:
          $ref: '#/components/schemas/AdditionalInfoResponseTimestamps'
          description: 'This contains a number of timestamps that describe when the alert was created, and when the described alert actually

            takes place and/or is relevant.

            '
        type:
          description: 'This indicates the category of the service alert. For example, if this value is `stopInfo`, then the alert is

            related to an issue affecting a stop. It is then likely that the affected lines would be those that stop at

            the affected stop.


            * `routeInfo`: The alert is related to a specific route

            * `stopInfo`: The alert is related to a specific stop

            * `stopBlocking`: This alert is related to a stop closure

            * `lineInfo`: The alert is related to a specific journey

            * `bannerInfo`: The alert of high importance and potentially has a network-wide impact.

            '
          enum:
          - routeInfo
          - stopInfo
          - lineInfo
          - bannerInfo
          - stopBlocking
          type: string
        url:
          description: This field contains a URL that contains additional information about the alert.
          type: string
        urlText:
          description: This field contains a title that can be used when displaying the `infoLinkURL` URL.
          type: string
        version:
          description: 'This number indicates the version of this alert. Initially when it is created it has version `1`, but if it is then

            updated it will have a new `lastModification` value and the version will now be `2`.

            '
          type: integer
      type: object
    HttpErrorResponse:
      description: 'This element contains information about a HTTP error that occurred.

        '
      properties:
        ErrorDateTime:
          description: The date and time that the error occurred.
          type: string
        Message:
          description: A detailed message about the error.
          type: string
        RequestedMethod:
          description: The HTTP request method used for the current request.
          type: string
        RequestedUrl:
          description: The URL for the current request.
          type: string
        TransactionId:
          description: A unique identifier for the current request.
          type: string
      type: object
    AdditionalInfoResponseAffectedLine:
      description: This element describes a single route that is affected by a service alert.
      properties:
        destination:
          description: This element describes the destination of trips fulfilled by the given line.
          properties:
            name:
              description: This is the name of the destination.
              type: string
            type:
              description: The type of the location the destination is.
              enum:
              - poi
              - singlehouse
              - stop
              - platform
              - street
              - locality
              - suburb
              - gisPoint
              - unknown
              type: string
          type: object
        id:
          description: This is the unique ID that identifies the given line.
          type: string
        name:
          description: This is the full name of the route.
          type: string
        number:
          description: This is the short name or code of the route.
          type: string
        product:
          $ref: '#/components/schemas/RouteProduct'
          description: This element contains additional properties about the route.
      type: object
    ParentLocation:
      description: 'Describes a parent location. Locations are hierarchical, mean a location has a parent, and

        a location may have any number of child locations. A parent location is often included with locations,

        which can help traverse the location tree.

        '
      properties:
        disassembledName:
          description: 'This is the short version of the location name, which does not include the suburb or other information.

            '
          type: string
        id:
          description: 'This is a unique ID for the returned location. Certain types of ID can be used for subsequent searches performed with `stop_finder`,

            or can be used as the origin or destination in an `trip` request. The format of a location ID differs greatly, depending

            on the type of location it is.

            '
          type: string
        name:
          description: 'This is the long version of the location name, which may include the suburb or other information.

            '
          type: string
        parent:
          $ref: '#/components/schemas/ParentLocation'
          description: 'In some cases, a parent location will also contain its parent (in other words, the grandparent of the initial location)

            '
        type:
          description: 'This is the type of location being returned. It may represent a stop or platform that a public transport service physically

            stops at for passenger boarding, or it may represent somebody''s house.

            A value of `unknown` likely indicates bad data coming from the server. If a location is returned with this type, you can safely ignore it.

            '
          enum:
          - poi
          - singlehouse
          - stop
          - platform
          - street
          - locality
          - suburb
          - unknown
          type: string
      type: object
    AdditionalInfoResponseTimestamps:
      description: This element describes timestamps for a service alert.
      properties:
        availability:
          description: 'This describes when the alert should published. Note that this is used as guidance only and your own

            needs may vary.

            '
          properties:
            from:
              description: A timestamp in `YYYY-MM-DDTHH:MM:SSZ` format
              format: dateTime
              type: string
            to:
              description: A timestamp in `YYYY-MM-DDTHH:MM:SSZ` format
              format: dateTime
              type: string
          type: object
        creation:
          description: A timestamp in `YYYY-MM-DDTHH:MM:SSZ` format that indicates when the alert was created.
          format: dateTime
          type: string
        lastModification:
          description: A timestamp in `YYYY-MM-DDTHH:MM:SSZ` format that indicates when the alert was last modified.
          format: dateTime
          type: string
        validity:
          description: 'This describes when the incident is actually occurring.

            '
          items:
            properties:
              from:
                description: A timestamp in `YYYY-MM-DDTHH:MM:SSZ` format that indicates the starting date and time of this date range.
                format: dateTime
                type: string
              to:
                description: A timestamp in `YYYY-MM-DDTHH:MM:SSZ` format that indicates the ending date and time of this date range.
                format: dateTime
                type: string
            type: object
          type: array
      type: object
    ApiErrorResponse:
      description: 'This element contains information about an error that may have occurred when handling an API request.

        '
      properties:
        message:
          description: Describes the error that went wrong
          type: string
        versions:
          description: 'If the error was related to the API version, this element contains version information.

            '
          properties:
            controller:
              description: The version of the API handling the request
              type: string
            interfaceMax:
              description: The maximum version number that can be requested in the `version` request parameter.
              type: string
            interfaceMin:
              description: The minimum version number that can be requested in the `version` request parameter.
              type: string
          type: object
      type: object
    RouteProduct:
      description: This element contains additional properties about the route.
      properties:
        class:
          description: 'This field indicates the type of the route, using the same values

            as elsewhere in this API.


            * `1`: Train

            * `2`: Metro

            * `4`: Light Rail

            * `5`: Bus

            * `7`: Coach

            * `9`: Ferry

            * `11`: School Bus

            * `99`: Walking

            * `100`: Walking (Footpath)

            * `101`: Bicycle

            * `102`: Take Bicycle On Public Transport

            * `103`: Kiss & Ride

            * `104`: Park & Ride

            * `105`: Taxi

            * `106`: Car

            '
          type: integer
        iconId:
          description: 'This field is used by to determine which icon to use when displaying

            this affected route. It will typically match up with the `class` value.

            '
          type: integer
        name:
          description: Name of the product
          type: string
      type: object
  securitySchemes:
    APIKey:
      description: 'Expected Format: apikey [TOKEN]'
      in: header
      name: Authorization
      type: apiKey
