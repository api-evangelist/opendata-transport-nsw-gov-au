openapi: 3.2.0
info:
  title: Opendata Transport Nsw Gov Au Historical Traffic API
  version: 1.0.0
  description: 'Operations tagged HistoricalTraffic across 2 of this provider''s published API definitions: historicaldata.yaml, opendata-transport-nsw-gov-au-historical-traffic-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.transport.nsw.gov.au/v1
security:
- APIKey: []
tags:
- name: HistoricalTraffic
paths:
  /traffic/historicaldata:
    post:
      description: Retrieves Historical Data
      operationId: GetHistoricalData
      responses:
        '200':
          description: The request has been processed successfully.
          content:
            application/json:
              schema:
                type: string
                format: binary
        '401':
          description: The application calling the API has not been authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: The requested resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: System failure, server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '503':
          description: The server is currently unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - HistoricalTraffic
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveHistoricalDataRequest'
        description: Request object type has details to retrieve historical traffic
        required: true
      summary: Get historical data
      x-summary-source: derived
    servers:
    - url: https://api.transport.nsw.gov.au/v1
components:
  schemas:
    ErrorDetails:
      description: Error response
      example:
        ErrorDetails:
          ErrorDateTime: XXXXXXXXXX
          Message: XXXXXXXXXX
          RequestedMethod: XXXXXXXXXX
          RequestedUrl: XXXXXXXXXX
          TransactionId: XXXXXXXXXX
      properties:
        ErrorDateTime:
          type: string
        Message:
          type: string
        RequestedMethod:
          type: string
        RequestedUrl:
          type: string
        TransactionId:
          type: string
      required:
      - TransactionId
      - ErrorDateTime
      - Message
      - RequestedUrl
      - RequestedMethod
      type: object
    RetrieveHistoricalDataRequest:
      example:
        created: '2020-06-01T00:00:00.000+10:00'
        end: '2020-06-01T23:59:59.999+10:00'
        latitude: -33.86734
        longitude: 151.20823
        radius: 1.0
        showHistory: true
      properties:
        created:
          format: date-time
          type: string
        end:
          format: date-time
          type: string
        latitude:
          maximum: 90
          minimum: -90
          type: number
        longitude:
          maximum: 180
          minimum: -180
          type: number
        radius:
          maximum: 500
          minimum: 0
          type: number
        showHistory:
          type: boolean
      type: object
  securitySchemes:
    APIKey:
      description: 'Expected Format: apikey [TOKEN]'
      in: header
      name: Authorization
      type: apiKey
x-refined-from:
- historicaldata.yaml
- opendata-transport-nsw-gov-au-historical-traffic-openapi.yml
