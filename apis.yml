aid: opendata-transport-nsw-gov-au

name: Transport for NSW Open Data Hub

description: >-
  The Transport for NSW Open Data Hub (opendata.transport.nsw.gov.au) is the central location for all Transport for NSW
  open data, established in April 2016 at the Future Transport summit to replace the Transport Data Exchange (TDX)
  program. It hosts over 200 datasets with more than 1000 resources (APIs, downloadable files, interactive maps and
  insights), including GTFS and GTFS-realtime public transport feeds and Live Traffic NSW data, used by 35,700+
  registered developers who have created 9000+ applications. The catalogue runs CKAN, exposing the standard CKAN Action
  API for dataset search and metadata, alongside a developer portal with documentation, a user guide, API status, FAQs
  and a community forum.

