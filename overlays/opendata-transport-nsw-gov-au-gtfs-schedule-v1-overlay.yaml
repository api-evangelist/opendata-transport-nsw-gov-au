      that support realtime. Covers Buses, Ferries, Light Rail, Trains, Metro and Regional Bus Services (our regional
      services are at times referenced as "TCB" - Transport Connected Bus). An up to date list of all TCB services
      can be found on the forum . Swagger 2.0 contract published by Transport for NSW on the Open Data Hub dataset
      page; served via the TfNSW API Gateway (api.transport.nsw.gov.au), API key required.
